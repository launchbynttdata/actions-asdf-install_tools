name: Install ASDF tools from repo
description: Install ASDF and tools defined in .tool-versions and .tool-repos if they are present in the repository.
inputs:
  exclude_tools:
    description: 'Comma-separated list of tools to exclude from installation, e.g. "terraform,python"'
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install ASDF
      uses: asdf-vm/actions/setup@v3

    - name: Install ASDF plugins
      run: |
        if [ -f .tool-repos ]; then
          cat .tool-repos | while read tool || [[ -n $tool ]]; do
            PLUGIN=$(echo $tool | cut -d ' ' -f 1)
            echo "Plugin: $PLUGIN"
            REPO=$(echo $tool | cut -d ' ' -f 2)
            echo "URL: $REPO"
            asdf plugin add $PLUGIN $REPO
          done
        fi
      shell: bash

    - name: Install ASDF tools
      run: |
        if [ -f .tool-versions ]; then
          IFS=',' read -ra exclude_items <<< "${{ inputs.exclude_tools }}"

          grep_pattern=""
          for item in "${exclude_items[@]}"; do
            # Skip empty items
            [ -z "$item" ] && continue

            echo "::warning file=.tool-versions,title=Excluded tool::ASDF will skip installing: $item"

            # Add to grep pattern
            if [ -z "$grep_pattern" ]; then
              grep_pattern="$item"
            else
              grep_pattern="$grep_pattern\|$item"
            fi
          done

          grep -v "$grep_pattern" .tool-versions | awk -F'[ #]' '$NF ~ /https/ {system("asdf plugin add " $1 " " $NF)} $1 ~ /./ {system("asdf plugin add " $1 "; asdf install " $1 " " $2)}'
        fi
      shell: bash
